name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
            args: --mac dmg --arm64
          - os: macos-13
            name: macos-x64
            args: --mac dmg --x64
          - os: windows-latest
            name: windows-x64
            args: --win nsis zip --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 从 tag 取版本号
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: 构建渲染层与主进程
        run: npm run build
      - name: 打包
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: plainote-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
